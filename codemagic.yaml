# ══ Build iOS dari Windows ═══════════════════════════════════════════
#
# Proyek ini dikembangkan di Windows, sementara mengompilasi Flutter ke iOS
# mutlak menuntut macOS dan Xcode. Berkas inilah jembatannya: Codemagic
# menjalankan build di Mac mini awan, hasilnya diunduh ke Windows, lalu
# ditandatangani dan dipasang ke perangkat memakai Sideloadly.
#
# Hasil build ini SENGAJA tanpa tanda tangan. Menandatanganinya di sini
# menuntut keanggotaan Apple Developer Program berbayar; Sideloadly bisa
# melakukannya secara lokal dengan Apple ID gratis.
#
# PENTING: Codemagic mengabaikan berkas ini selama aplikasi masih memakai
# Workflow Editor. Di halaman pengaturan aplikasi, tekan lebih dulu
# "Switch to YAML configuration".
#
# Panduan langkah demi langkah: jejak-cahaya-docs/panduan-ios.html

workflows:
  ios_unsigned:
    name: iOS unsigned build
    instance_type: mac_mini_m2

    # 45, bukan 30. Build pertama mengunduh MapLibre 6.19.1 dari nol dan
    # mengompilasi seluruh dependensi; 30 menit terlalu ketat untuk itu.
    # Build berikutnya jauh lebih singkat karena cache di bawah.
    max_build_duration: 45

    environment:
      # Disematkan, BUKAN `stable`. Ini bukan kehati-hatian teoretis —
      # `stable` sudah pernah menggagalkan build ini:
      #
      #   [!] CocoaPods could not find compatible versions for pod "Flutter"
      #       ...they required a higher minimum deployment target.
      #
      # Flutter menaikkan minimum iOS dari 13 ke 15 (flutter#187741, demi
      # Xcode 27), sementara ios/Podfile dan Runner.xcodeproj masih menyatakan
      # 13.0 — angka yang benar untuk SDK 3.44.4 di laptop, dan bisa dibaca
      # sendiri di podhelper.rb baris 236 milik SDK itu.
      #
      # Menyematkan versi bukan sekadar demi reproduktifitas: ia menjaga agar
      # iOS minimum aplikasi tetap keputusan yang diambil sadar, bukan berubah
      # sendiri karena SDK di awan bergerak pada hari build dijalankan. Naikkan
      # angka ini hanya berbarengan dengan menaikkan SDK di laptop.
      #
      # Bila Codemagic menolak dengan "Flutter version not found", pakai versi
      # terdekat yang ia punya pada seri 3.44.
      flutter: 3.44.4
      xcode: latest
      cocoapods: default

      vars:
        # Alamat backend tertanam saat kompilasi, bukan dibaca saat aplikasi
        # berjalan — lihat alasannya di lib/core/config/app_config.dart.
        # Mengubahnya karena itu menuntut build baru, bukan sekadar setelan.
        #
        # Akhiran /api/v1 wajib ikut: seluruh jalur di
        # core/constants/api_endpoints.dart ditulis relatif terhadap nilai
        # ini, jadi tanpa akhiran itu setiap permintaan mendarat di
        # /auth/login dan dijawab 404.
        API_BASE_URL: "https://api.jejak-cahaya.com/api/v1"

    # ── Cache ────────────────────────────────────────────────────────
    #
    # Menghemat 3–5 menit per build, hampir seluruhnya dari unduhan MapLibre
    # 6.19.1 yang berukuran besar.
    #
    # `ios/Pods` SENGAJA tidak ikut di-cache. Folder itu harus selalu
    # dirakit ulang dari Podfile.lock; Pods basi yang tertinggal setelah
    # dependensi berubah menghasilkan galat penautan yang menyesatkan —
    # menyebut nama pod, bukan menyebut bahwa isinya kedaluwarsa. Yang
    # di-cache hanyalah unduhannya, sehingga perakitan ulang tetap cepat.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    # ── Pemicu otomatis ──────────────────────────────────────────────
    #
    # Sengaja dibiarkan mati. Paket gratis memberi 500 menit macOS sebulan,
    # sementara satu build iOS memakan 12–18 menit — membangun otomatis di
    # setiap push ke master akan menghabiskannya dalam hitungan hari, padahal
    # sebagian besar commit tidak menyentuh sisi iOS sama sekali.
    #
    # Build dijalankan manual lewat tombol "Start new build". Bila kelak
    # pindah ke akun berbayar, hapus tanda komentar di bawah.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: master
    #       include: true
    #       source: true

    scripts:
      - name: Ambil paket Flutter
        script: flutter pub get

      # Analisis dan pengujian ditaruh SEBELUM build, bukan sesudahnya.
      # Keduanya selesai dalam ~1 menit, sementara build iOS memakan 12–18
      # menit; menjalankannya lebih dulu berarti kesalahan yang sebenarnya
      # bisa ditangkap di laptop tidak sampai membakar kuota bulanan.
      - name: Analisis statis
        script: flutter analyze

      - name: Uji unit & widget
        script: flutter test

      - name: Pasang pod
        # `flutter build` sebenarnya memanggil pod install sendiri. Langkah
        # ini dipisahkan supaya kegagalan CocoaPods muncul sebagai langkah
        # yang gagal dengan namanya sendiri, bukan terkubur di tengah log
        # Xcode yang panjang.
        #
        # Konsekuensinya perlu disadari: menjalankannya lebih dulu melewati
        # migrator bawaan `flutter build`, yang biasanya menaikkan sendiri
        # angka deployment target di Podfile dan pbxproj bila SDK menuntut
        # yang lebih tinggi. Selama versi Flutter di atas disematkan sama
        # dengan yang di laptop, migrasi itu memang tidak diperlukan — tetapi
        # begitu versinya dinaikkan, Podfile dan Runner.xcodeproj harus
        # dinaikkan bersamaan, bukan diserahkan ke migrator.
        #
        # Pod tetap diperlukan meski proyek Xcode-nya sudah memakai Swift
        # Package Manager: flutter_secure_storage dan path_provider_foundation
        # belum menyediakan Package.swift. Lihat komentar di ios/Podfile.
        script: cd ios && pod install

      - name: Bangun .app tanpa tanda tangan
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENABLE_NETWORK_LOG=false

      - name: Bungkus .app menjadi .ipa
        # `flutter build ipa --no-codesign` TIDAK menghasilkan .ipa sama
        # sekali. Begitu penandatanganan dimatikan, flutter_tools berhenti
        # sesudah membuat .xcarchive:
        #
        #   "Codesigning disabled with --no-codesign, skipping IPA."
        #   (flutter_tools/lib/src/commands/build_ios.dart)
        #
        # Kegagalannya diam — build tetap hijau, hanya artifact-nya kosong.
        # Karena itu paketnya dirakit sendiri di sini. Sebuah .ipa memang
        # hanya zip berisi satu folder bernama Payload/.
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r "$CM_BUILD_DIR/JejakCahaya-unsigned.ipa" Payload

    artifacts:
      - JejakCahaya-unsigned.ipa

    publishing:
      # Tautan unduhan dikirim lewat surel supaya .ipa bisa diambil tanpa
      # membuka dasbor. `failure: true` sama pentingnya dengan `success`:
      # build yang gagal diam-diam adalah build yang ditunggu percuma.
      email:
        recipients:
          - gilangmukharom@gmail.com
        notify:
          success: true
          failure: true
