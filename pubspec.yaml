name: jejak_cahaya
description: Jejak Cahaya — Islamic Explorer. Permainan edukasi berbasis lokasi di area masjid.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Dependency injection ──────────────────────────────────────
  # get_it dipakai tanpa injectable: pendaftaran ditulis manual di satu berkas
  # (core/di/injection.dart) agar grafik dependensi bisa dibaca langsung, dan
  # agar codegen hanya diperlukan untuk model — bukan untuk menjalankan aplikasi.
  get_it: ^8.0.3

  # ── Jaringan ──────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Penyimpanan ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ── Lokasi & peta ─────────────────────────────────────────────
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Basemap vektor gaya permainan. Petanya digambar sendiri di perangkat dari
  # data vektor Protomaps (turunan OpenStreetMap) alih-alih menarik gambar jadi
  # dari server tile: hanya dengan begitu paletnya bisa ditentukan sepenuhnya —
  # rumput hijau, air toska, label POI dimatikan — dan tidak ada satu pun
  # permintaan jaringan ke server tile pihak ketiga.
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  # Dipakai langsung: tipe `Theme` gaya peta dan `ThemeReader` berasal dari sini,
  # jadi ia disebut eksplisit alih-alih diandalkan sebagai dependensi transitif.
  vector_tile_renderer: ^5.2.1
  # Dipakai langsung oleh pengujian gaya peta, yang membuka arsip .pmtiles dan
  # menggambar tile sungguhan untuk memastikan layernya benar-benar terpilih.
  pmtiles: ^1.3.0

  # Arsip .pmtiles dibundel sebagai aset, tetapi paket pmtiles membacanya lewat
  # pembacaan acak pada berkas — jadi aset perlu disalin dulu ke direktori
  # aplikasi. Di sinilah path_provider dipakai.
  path_provider: ^2.1.5

  # ── Pemindai QR ───────────────────────────────────────────────
  # Versi 5.x membawa CameraX 1.3.3 dan dibangun untuk compileSdk 34, sementara
  # aplikasi ini menargetkan SDK 36. Pada perangkat Android modern selisih itu
  # membuat kamera gagal di-bind dan gagalnya muncul sebagai `genericError` —
  # pesan yang tidak menyebut penyebabnya sama sekali. Versi 7.x memakai
  # CameraX 1.6.1 dengan compileSdk 36, dan sekaligus menangani siklus hidup
  # aplikasi meski controller disediakan sendiri.
  mobile_scanner: ^7.4.0

  # ── Peta 3D (percobaan, berdampingan dengan flutter_map) ──────
  # MapLibre adalah fork BSD dari Mapbox GL Native v1, dibuat persis ketika
  # Mapbox pindah ke lisensi proprietary dengan token wajib: tanpa kunci API,
  # tanpa kuota, tanpa akun. Sumber tile-nya tetap berkas .pmtiles milik
  # sendiri, yang dibaca MapLibre secara native.
  #
  # Ditahan di 0.25.x, bukan 0.27.x. Versi 0.27 menarik `image` 4.x yang
  # menuntut `archive` 4.x, sementara paket `pmtiles` yang dipakai lapisan
  # flutter_map masih menuntut `archive` 3.x — keduanya tidak bisa hidup
  # berdampingan. PMTiles sendiri sudah didukung sejak 0.22.0, jadi menahan
  # versi di sini tidak mengorbankan apa pun yang dibutuhkan.
  maplibre_gl: ^0.25.0

  # ── Rute ──────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Antarmuka ─────────────────────────────────────────────────
  google_fonts: ^6.2.1
  confetti: ^0.8.0

  # ── Utilitas ──────────────────────────────────────────────────
  # Versi di-pin oleh flutter_localizations dari SDK — jangan naikkan sendiri.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Membangkitkan ikon peluncur Android & iOS dari berkas di launcher_icon/.
  # Hanya dipakai saat build — tidak ikut ke dalam aplikasi.
  flutter_launcher_icons: ^0.14.4

# ── Ikon peluncur ───────────────────────────────────────────────
#
# Sumbernya ada di launcher_icon/, di luar assets/ dengan sengaja: direktori
# `assets/icons/` terdaftar di bawah, jadi apa pun di sana ikut dibundel ke APK
# — padahal ikon peluncur tidak pernah dibaca saat aplikasi berjalan.
#
# Jalankan ulang setelah mengubah berkas sumbernya:
#   dart run flutter_launcher_icons
#
# Lihat launcher_icon/README.md untuk alasan di balik ukuran tiap lapisan.
flutter_launcher_icons:
  image_path: launcher_icon/app_icon.png

  android: ic_launcher
  # Dua lapisan terpisah, bukan satu gambar: inilah yang membuat ikon mengikuti
  # bentuk pangkas tiap peluncur alih-alih tampil sebagai kotak putih di dalamnya.
  adaptive_icon_background: launcher_icon/app_icon_background.png
  adaptive_icon_foreground: launcher_icon/app_icon_foreground.png
  # Lapisan tunggal untuk Android < 26, yang belum mengenal adaptive icon.
  min_sdk_android: 21

  ios: true
  # App Store menolak ikon bertransparansi. Sumber iOS memang sudah tanpa alpha,
  # tetapi baris ini menjaganya tetap begitu bila suatu saat gambarnya diganti.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # Basemap vektor offline (Protomaps v4, turunan OpenStreetMap, ODbL).
    # Disebut per berkas, bukan sebagai direktori: mendaftarkan `assets/map/`
    # ikut membundel README.md di sebelahnya ke dalam APK.
    # Lihat assets/map/README.md untuk cara membuat ulang berkas ini.
    - assets/map/basemap.pmtiles
  # Tipografi memakai Plus Jakarta Sans lewat paket google_fonts, sehingga tidak
  # ada berkas font yang perlu dibundel. Bila nanti ingin memakai font Arab
  # (mis. Amiri) untuk kaligrafi, letakkan .ttf-nya di assets/fonts/ lalu
  # daftarkan di sini — mendeklarasikan font tanpa berkasnya akan menggagalkan build.
